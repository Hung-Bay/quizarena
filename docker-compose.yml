name: quizarena

# ---- Phần dùng chung cho 3 service backend (cùng một image, khác `command`) ----
x-backend: &backend
  build:
    context: ./backend
  image: quizarena-backend:${TAG:-dev}
  env_file: .env
  restart: unless-stopped
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ------------------------------------------------------------------ Dữ liệu
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Chưa đặt POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chưa đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?Chưa đặt POSTGRES_DB trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Chưa đặt REDIS_PASSWORD trong .env}
    # Đọc password từ biến môi trường để không lộ trong `docker ps` / `docker inspect`.
    # noeviction: Redis giữ trạng thái trận, đầy bộ nhớ thì báo lỗi ghi chứ không âm thầm xóa dữ liệu.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
    logging: *default-logging

  # ------------------------------------------------------- Migration (chạy 1 lần)
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  # ------------------------------------------------------------- Ứng dụng
  api:
    <<: *backend
    command: ["uvicorn", "app.main_api:app", "--host", "0.0.0.0", "--port", "8000"]
    # healthcheck lấy mặc định từ Dockerfile: GET http://127.0.0.1:8000/api/v1/healthz
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis:   { condition: service_healthy }
    networks: [app, data]
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  realtime:
    <<: *backend
    command: ["uvicorn", "app.main_realtime:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HEALTH_URL: http://127.0.0.1:8000/healthz   # realtime không có tiền tố /api/v1
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis:   { condition: service_healthy }
    networks: [app, data]
    stop_grace_period: 30s    # chừa thời gian để gửi server.draining và đóng kết nối êm
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      disable: true           # worker không có HTTP; Phase 3 thay bằng kiểm tra riêng
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis:   { condition: service_healthy }
    networks: [app, data]     # `app` (không internal) để sau này gọi được Gemini
    stop_grace_period: 30s    # chờ job đang chạy làm xong
    deploy:
      resources:
        limits:
          memory: 256M

  # ------------------------------------------------------------- Gateway
  nginx:
    image: nginx:1.27-alpine  # cần >= 1.27.3 cho `server ... resolve` trong upstream
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"   # cổng duy nhất của hệ thống mở ra ngoài
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:      { condition: service_healthy }
      realtime: { condition: service_healthy }
    networks: [edge, app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *default-logging

networks:
  edge: {}                    # chỉ nginx
  app: {}                     # nginx ↔ api / realtime / worker
  data:
    internal: true            # postgres, redis: không có đường ra Internet
  # monitoring: {}            # thêm ở Phase 5–6 (Prometheus, Grafana, Loki…)

volumes:
  pgdata:
  redisdata:
