x-dev-env: &dev-env
  APP_ENV: dev
  # Docker Desktop trên Windows không chuyển được sự kiện thay đổi file từ ổ Windows vào container,
  # nên cho uvicorn/watchfiles quét định kỳ (polling) để --reload hoạt động.
  WATCHFILES_FORCE_POLLING: "true"

services:
  postgres:
    ports:
      - "5433:5432"
    networks:
      - data
      - default

  redis:
    ports:
      - "6380:6379"
    networks:
      - data
      - default

  migrate:
    volumes:
      - ./backend/alembic:/app/alembic:ro

  api:
    command:
      - uvicorn
      - app.main_api:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/app
    environment:
      <<: *dev-env
    volumes:
      - ./backend/app:/app/app:ro      # sửa code trên máy → container tự nạp lại
      - ./backend/alembic:/app/alembic:ro

  realtime:
    command:
      - uvicorn
      - app.main_realtime:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/app
    environment:
      <<: *dev-env
      HEALTH_URL: http://127.0.0.1:8000/healthz
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro

  worker:
    environment:
      <<: *dev-env
    volumes:
      - ./backend/app:/app/app:ro      # worker không tự reload: sửa xong chạy `docker compose restart worker`

  nginx:
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
