worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;   # mỗi kết nối WS chiếm 2 (client + upstream)
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;         # không lộ phiên bản nginx
    sendfile      on;
    keepalive_timeout 65;

    # --- DNS nội bộ của Docker: để nginx tự nhận replica mới khi `--scale` ---
    resolver 127.0.0.11 valid=5s ipv6=off;

    # --- Log JSON có request_id, upstream (không ghi query string để khỏi lộ ticket/PIN) ---
    log_format json_combined escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"request_id":"$request_id",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_response_time":"$upstream_response_time"'
        '}';
    access_log /dev/stdout json_combined;

    # --- Upgrade WebSocket: có header Upgrade thì chuyển giao thức, không thì đóng như thường ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Upstream: `zone` + `resolve` = replica mới tự được nhận, KHÔNG cần reload nginx ---
    upstream api {
        zone api_upstream 64k;
        server api:8000 resolve;
    }

    upstream realtime {
        zone realtime_upstream 64k;
        least_conn;                      # kết nối WS sống lâu → chọn replica ít kết nối nhất
        server realtime:8000 resolve;
    }

    # --- Giới hạn tần suất (con số khởi điểm, hiệu chỉnh bằng load test ở Phase 5) ---
    limit_req_zone  $binary_remote_addr zone=api_general:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api_sensitive:10m rate=5r/s;   # auth/*, games/join
    limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

    limit_req_status  429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;         # mặc định nhỏ; chỉ route upload được nâng lên

        # --- Header bảo mật cơ bản. (TLS bật rồi mới thêm HSTS; CSP viết khi có frontend) ---
        add_header X-Content-Type-Options "nosniff"                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-Request-ID           $request_id                   always;

        # --- Lỗi trả JSON, cùng khuôn với API ---
        error_page 413 @payload_too_large;
        error_page 429 @too_many_requests;
        error_page 502 503 504 @upstream_unavailable;

        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Nội dung gửi lên quá lớn","request_id":"$request_id"}}';
        }
        location @too_many_requests {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Quá nhiều yêu cầu, hãy thử lại sau","request_id":"$request_id"}}';
        }
        location @upstream_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Dịch vụ tạm thời không sẵn sàng","request_id":"$request_id"}}';
        }

        # --- Health của chính nginx (cho healthcheck trong compose) ---
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- Chặn nội bộ: không cho truy cập từ Internet ---
        location ~ ^/(metrics|internal|docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        # --- REST: /api/ → upstream api ---
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # Chỉ nginx đứng ngoài cùng nên dùng $remote_addr, không nối thêm giá trị client tự gửi (chống giả IP)
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            # Upload tài liệu cho AI: chỉ route này được nhận tới 10 MB.
            # Location lồng nhau kế thừa các proxy_set_header ở trên, nhưng phải tự khai báo proxy_pass.
            location = /api/v1/ai/quiz-generations {
                client_max_body_size 10m;
                limit_req zone=api_general burst=60 nodelay;
                proxy_pass http://api;
            }
        }

        # --- Đăng nhập/đăng ký/đổi token và vào trận: giới hạn chặt hơn (chống dò mật khẩu, dò PIN) ---
        location ~ ^/api/v1/(auth/|games/join$) {
            # burst đủ lớn để cả lớp cùng join một lúc sau một địa chỉ NAT vẫn qua được
            limit_req zone=api_sensitive burst=60 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
        }

        # --- WebSocket: /ws/ → upstream realtime ---
        location /ws/ {
            limit_conn ws_per_ip 50;     # số WS tối đa mỗi IP (cả lớp thường dùng chung một IP NAT)

            proxy_pass         http://realtime;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            proxy_read_timeout 3600s;    # mặc định 60s sẽ làm WS rớt đều đặn
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }

        # --- Frontend (Phase 4 thay bằng bản build; Phase 0 dùng trang mặc định của nginx) ---
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;     # SPA fallback
        }
    }
}
