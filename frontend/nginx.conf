server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets được Vite đánh hash trong tên file (cache 1 năm)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routing: index.html không cache để luôn nhận mã nguồn mới nhất
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck nội bộ cho container web
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
