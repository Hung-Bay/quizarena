[project]
name = "quizarena"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.159.1",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "typer>=0.27.3",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pre-commit-uv>=4.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/ai/gemini_gateway.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"google.genai".msg = "SDK google-genai chỉ được phép import duy nhất tại app.ai.gemini_gateway (ADR-002, FR-AIGEN-12)."

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
quizarena = "app.cli:app"
